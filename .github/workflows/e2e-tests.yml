name: E2E Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'shim/**'
      - 'tests/e2e-dotnet/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'shim/**'
      - 'tests/e2e-dotnet/**'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:
    inputs:
      test_host:
        description: 'Windows test host IP/hostname'
        required: false
        default: 'windows-test-host'
      skip_network_tests:
        description: 'Skip network tests'
        type: boolean
        default: false

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Cargo.toml path-depends on ../kerbsec, and Cargo reads that manifest even
  # with the kerberos feature off, so every cargo job checks out both repos
  # side by side. The fabi-kerbsec rename lives on this branch until it is
  # merged; switch to master then.
  KERBSEC_REF: fix/macos-bindgen-sdk

jobs:
  build-library:
    name: Build Rust Library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux-wmi

    steps:
    - uses: actions/checkout@v4
      with:
        path: linux-wmi

    - uses: actions/checkout@v4
      with:
        repository: jfabienke/kerbsec
        ref: ${{ env.KERBSEC_REF }}
        path: kerbsec

    - name: Install GSS-API headers
      run: |
        sudo apt-get update
        sudo apt-get install -y libkrb5-dev

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache target
      uses: actions/cache@v3
      with:
        path: linux-wmi/target
        key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Build library
      run: cargo build --lib --release

    - name: Upload library artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-wmi-library
        path: linux-wmi/target/release/libfabi_wmi.so

  test-dotnet:
    name: .NET E2E Tests
    needs: build-library
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # dorny/test-reporter publishes a check run
    strategy:
      matrix:
        dotnet: ['10.0.x']

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ matrix.dotnet }}

    - name: Download library artifact
      uses: actions/download-artifact@v4
      with:
        name: linux-wmi-library
        path: target/release

    - name: Set execute permissions on library
      run: chmod +x target/release/libfabi_wmi.so || true

    - name: Restore .NET packages
      working-directory: tests/e2e-dotnet
      run: dotnet restore

    - name: Build test project
      working-directory: tests/e2e-dotnet
      run: dotnet build --configuration Release --no-restore

    - name: Copy library to test output
      run: cp target/release/libfabi_wmi.so tests/e2e-dotnet/bin/Release/net10.0/

    - name: Run tests (mock mode)
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_network_tests == 'true'
      working-directory: tests/e2e-dotnet
      env:
        WMI_TEST_SKIPNETWORKTESTS: true
        WMI_TEST_SKIPAUTHTESTS: true
      run: |
        dotnet test \
          --configuration Release \
          --no-build \
          --logger "trx;LogFileName=test-results.trx" \
          --logger "console;verbosity=detailed" \
          --results-directory ./TestResults

    - name: Run tests (live mode)
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_network_tests == 'false'
      working-directory: tests/e2e-dotnet
      env:
        WMI_TEST_DEFAULTHOST: ${{ github.event.inputs.test_host || secrets.WMI_TEST_HOST }}
        WMI_TEST_DEFAULTUSERNAME: ${{ secrets.WMI_TEST_USERNAME }}
        WMI_TEST_DEFAULTPASSWORD: ${{ secrets.WMI_TEST_PASSWORD }}
        WMI_TEST_DEFAULTDOMAIN: ${{ secrets.WMI_TEST_DOMAIN }}
        WMI_TEST_SKIPNETWORKTESTS: false
        WMI_TEST_SKIPAUTHTESTS: false
      run: |
        dotnet test \
          --configuration Release \
          --no-build \
          --logger "trx;LogFileName=test-results.trx" \
          --logger "console;verbosity=detailed" \
          --results-directory ./TestResults \
          --filter "Category!=LongRunning"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.dotnet }}
        path: tests/e2e-dotnet/TestResults/*.trx

    - name: Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: .NET E2E Tests Report
        path: tests/e2e-dotnet/TestResults/*.trx
        reporter: dotnet-trx

  windows-integration:
    name: Windows Integration Tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: build-library
    defaults:
      run:
        working-directory: linux-wmi

    steps:
    - uses: actions/checkout@v4
      with:
        path: linux-wmi

    - uses: actions/checkout@v4
      with:
        repository: jfabienke/kerbsec
        ref: ${{ env.KERBSEC_REF }}
        path: kerbsec

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build library (Windows)
      run: cargo build --lib --release

    - name: Build test project
      working-directory: linux-wmi/tests/e2e-dotnet
      run: dotnet build --configuration Release

    - name: Run integration tests
      working-directory: linux-wmi/tests/e2e-dotnet
      env:
        WMI_TEST_DEFAULTHOST: localhost
        WMI_TEST_DEFAULTUSERNAME: ${{ secrets.WINDOWS_TEST_USER }}
        WMI_TEST_DEFAULTPASSWORD: ${{ secrets.WINDOWS_TEST_PASS }}
        WMI_TEST_SKIPNETWORKTESTS: false
        WMI_TEST_SKIPAUTHTESTS: false
      run: |
        dotnet test `
          --configuration Release `
          --no-build `
          --logger "trx;LogFileName=windows-test-results.trx" `
          --results-directory ./TestResults `
          --filter "Category=Priority0"

    - name: Upload Windows test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: windows-test-results
        path: linux-wmi/tests/e2e-dotnet/TestResults/*.trx

  coverage:
    name: Code Coverage
    needs: test-dotnet
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Download library artifact
      uses: actions/download-artifact@v4
      with:
        name: linux-wmi-library
        path: target/release

    - name: Install coverage tool
      run: dotnet tool install --global coverlet.console

    - name: Build with coverage
      working-directory: tests/e2e-dotnet
      run: dotnet build --configuration Debug

    - name: Run tests with coverage
      working-directory: tests/e2e-dotnet
      env:
        WMI_TEST_SKIPNETWORKTESTS: true
        WMI_TEST_SKIPAUTHTESTS: true
      run: |
        coverlet bin/Debug/net10.0/E2ETests.dll \
          --target "dotnet" \
          --targetargs "test --no-build --configuration Debug" \
          --format opencover \
          --output ./coverage.opencover.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./tests/e2e-dotnet/coverage.opencover.xml
        flags: e2e-tests
        name: e2e-coverage