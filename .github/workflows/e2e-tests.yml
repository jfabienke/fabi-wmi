name: E2E Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'shim/**'
      - 'tests/e2e-dotnet/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'shim/**'
      - 'tests/e2e-dotnet/**'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:
    inputs:
      test_host:
        description: 'Windows test host IP/hostname'
        required: false
        default: 'windows-test-host'
      skip_network_tests:
        description: 'Skip network tests'
        type: boolean
        default: false

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Cargo.toml path-depends on ../fabi-kerbsec, and Cargo reads that manifest even
  # with the kerberos feature off, so every cargo job checks out both repos
  # side by side.
  KERBSEC_REF: master

jobs:
  build-library:
    name: Build Rust Library
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: fabi-wmi

    steps:
    - uses: actions/checkout@v7
      with:
        path: fabi-wmi

    - uses: actions/checkout@v7
      with:
        repository: jfabienke/fabi-kerbsec
        ref: ${{ env.KERBSEC_REF }}
        path: fabi-kerbsec

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache target
      uses: actions/cache@v6
      with:
        path: fabi-wmi/target
        key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Build library
      # test-support adds the stub backend the .NET tests use without a
      # Windows host (only when LINUX_WMI_USE_STUB=1).
      run: cargo build --lib --release --features test-support

    - name: Upload library artifact
      uses: actions/upload-artifact@v7
      with:
        name: fabi-wmi-library
        path: fabi-wmi/target/release/libfabi_wmi.so

  test-dotnet:
    name: .NET E2E Tests
    needs: build-library
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      checks: write # dorny/test-reporter publishes a check run
    strategy:
      matrix:
        dotnet: ['10.0.x']

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.dotnet }}

    - name: Download library artifact
      uses: actions/download-artifact@v8
      with:
        name: fabi-wmi-library
        path: target/release

    - name: Set execute permissions on library
      run: chmod +x target/release/libfabi_wmi.so || true

    - name: Restore .NET packages
      working-directory: tests/e2e-dotnet
      run: dotnet restore

    - name: Build test project
      working-directory: tests/e2e-dotnet
      run: dotnet build --configuration Release --no-restore

    - name: Copy library to test output
      run: cp target/release/libfabi_wmi.so tests/e2e-dotnet/bin/Release/net10.0/

    - name: Run tests (stub backend)
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_network_tests == 'true'
      working-directory: tests/e2e-dotnet
      env:
        LINUX_WMI_USE_STUB: '1'
      run: |
        dotnet test \
          --configuration Release \
          --no-build \
          --logger "trx;LogFileName=test-results.trx" \
          --logger "console;verbosity=detailed" \
          --results-directory ./TestResults

    - name: Run tests (live mode)
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_network_tests == 'false'
      working-directory: tests/e2e-dotnet
      env:
        WMI_TEST_DEFAULTHOST: ${{ github.event.inputs.test_host || secrets.WMI_TEST_HOST }}
        WMI_TEST_DEFAULTUSERNAME: ${{ secrets.WMI_TEST_USERNAME }}
        WMI_TEST_DEFAULTPASSWORD: ${{ secrets.WMI_TEST_PASSWORD }}
        WMI_TEST_DEFAULTDOMAIN: ${{ secrets.WMI_TEST_DOMAIN }}
        WMI_TEST_SKIPNETWORKTESTS: false
        WMI_TEST_SKIPAUTHTESTS: false
      run: |
        dotnet test \
          --configuration Release \
          --no-build \
          --logger "trx;LogFileName=test-results.trx" \
          --logger "console;verbosity=detailed" \
          --results-directory ./TestResults

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-${{ matrix.dotnet }}
        path: tests/e2e-dotnet/TestResults/*.trx

    - name: Test Report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: .NET E2E Tests Report
        path: tests/e2e-dotnet/TestResults/*.trx
        reporter: dotnet-trx
