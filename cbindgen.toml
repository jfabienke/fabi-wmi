# Generates include/linux_wmi.h from the C ABI in src/lib.rs:
#   cbindgen -o include/linux_wmi.h
# CI runs `cbindgen --verify -o include/linux_wmi.h` to catch drift.

language = "C"
header = "/* Generated by cbindgen from src/lib.rs; do not edit. Regenerate with:\n *   cbindgen -o include/linux_wmi.h */"
include_guard = "LINUX_WMI_H"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
cpp_compat = true
usize_is_size_t = true
documentation_style = "doxy"
# `WmiSession *`, not `struct WmiSession *`, behind the typedef.
style = "type"
# Keep the source order of src/lib.rs.
sort_by = "None"

[fn]
args = "Horizontal"

[export]
# A Rust-only constant re-exported from the crate root.
exclude = ["DEFAULT_TIMEOUT"]
