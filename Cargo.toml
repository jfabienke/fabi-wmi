[package]
name = "linux-wmi"
version = "0.2.0"
edition = "2021"

[lib]
name = "linux_wmi"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "wmi_query"
path = "examples/wmi_query.rs"

[dependencies]
byteorder = "1.5"
hex = "0.4"
hex-literal = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4"] }
zeroize = { version = "1.7", features = ["derive"] }
# Pure-Rust SSPI (Devolutions sspi-rs): NTLM handshake and RPC message protection
sspi = { version = "0.23", default-features = false }

[target.'cfg(unix)'.dependencies]
# Kerberos via the system GSS-API (internal kerbsec crate)
kerbsec = { path = "../kerbsec", version = "0.2.0", features = ["dns", "runtime", "trace", "ccache", "channel-bindings", "channel-bindings-rustls", "iov"], optional = true }

[features]
default = ["kerberos"]
kerberos = ["kerbsec"]
# In-process stub backend for the C ABI (LINUX_WMI_USE_STUB=1)
test-support = []
test-gss-mock = []

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
