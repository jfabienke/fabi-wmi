[package]
name = "linux-wmi"
version = "0.1.0"
edition = "2021"

[lib]
name = "linux_wmi"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "test_connect"
path = "examples/test_connect.rs"

[[example]]
name = "dcom_activation"
path = "examples/dcom_activation.rs"

[[example]]
name = "wmi_probe"
path = "examples/wmi_probe.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
byteorder = "1.5"
socket2 = "0.5"
md5 = "0.7"
hmac = "0.12"
hex-literal = "0.4"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "time"] }
nom = "7.1"
rc4 = "0.1"
