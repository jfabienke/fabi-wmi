[workspace]
members = ["crates/fabi-wmio", "crates/fabi-dcerpc", "crates/fabi-dcom"]

[package]
name = "fabi-wmi"
version = "0.2.0"
edition = "2021"

[lib]
name = "fabi_wmi"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "wmi_query"
path = "examples/wmi_query.rs"

[[example]]
name = "wmi_method"
path = "examples/wmi_method.rs"

[dependencies]
byteorder = "1.5"
fabi-dcerpc = { path = "crates/fabi-dcerpc" }
fabi-dcom = { path = "crates/fabi-dcom" }
fabi-wmio = { path = "crates/fabi-wmio" }
hex = "0.4"
hex-literal = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4"] }
zeroize = { version = "1.7", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
# Kerberos via the system GSS-API (fabi-kerbsec crate)
fabi-kerbsec = { path = "../kerbsec", version = "0.2.0", features = ["dns", "runtime", "trace", "ccache", "channel-bindings", "channel-bindings-rustls", "iov"], optional = true }

[features]
default = ["ffi", "kerberos"]
ffi = []
kerberos = ["fabi-kerbsec"]
# In-process stub backend for the C ABI (LINUX_WMI_USE_STUB=1)
test-support = []
test-gss-mock = []

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
