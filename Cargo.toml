[workspace]
members = ["crates/fabi-wmio", "crates/fabi-dcerpc", "crates/fabi-dcom"]

[package]
name = "fabi-wmi"
version = "0.2.0"
edition = "2021"

[lib]
name = "fabi_wmi"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "wmi_query"
path = "examples/wmi_query.rs"

[[example]]
name = "wmi_method"
path = "examples/wmi_method.rs"

[[example]]
name = "wmi_query_kerberos"
path = "examples/wmi_query_kerberos.rs"
required-features = ["kerberos"]

[dependencies]
byteorder = "1.5"
fabi-dcerpc = { path = "crates/fabi-dcerpc" }
fabi-dcom = { path = "crates/fabi-dcom" }
fabi-wmio = { path = "crates/fabi-wmio" }
hex-literal = "1.1"
libc = "0.2"
serde = "1.0"
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
# Kerberos via the system GSS-API (fabi-kerbsec crate). Only the DCE/RPC pieces:
# kerbsec's DNS, async runtime and rustls channel-binding features go unused here.
fabi-kerbsec = { path = "../kerbsec", version = "0.3.0", default-features = false, features = ["channel-bindings", "iov"], optional = true }

[features]
default = ["ffi", "kerberos"]
ffi = []
kerberos = ["fabi-kerbsec"]
# kerbsec's own tracing spans (GSS calls, handshake steps)
kerberos-trace = ["kerberos", "fabi-kerbsec/trace"]
# In-process stub backend for the C ABI (LINUX_WMI_USE_STUB=1)
test-support = []
test-gss-mock = []

[dev-dependencies]
hex = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
