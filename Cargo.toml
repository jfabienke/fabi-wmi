[package]
name = "linux-wmi"
version = "0.1.0"
edition = "2021"

[lib]
name = "linux_wmi"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "test_connect"
path = "examples/test_connect.rs"

[dependencies]
serde_json = "1.0"
libc = "0.2"
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
byteorder = "1.5"
socket2 = "0.5"
anyhow = "1.0"
base64 = "0.22"
md5 = "0.7"
sha2 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
regex = "1.11.2"
hmac = "0.12"
hex-literal = "0.4"
