[package]
name = "fabi-dcom"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
byteorder = "1.5"
fabi-dcerpc = { path = "../fabi-dcerpc" }
hex = "0.4"
hex-literal = "1.1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
fabi-testkit = { path = "../fabi-testkit" }
proptest = { version = "1.12", default-features = false, features = ["std"] }
