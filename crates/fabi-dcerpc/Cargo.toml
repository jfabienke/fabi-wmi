[package]
name = "fabi-dcerpc"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
byteorder = "1.5"
hex = "0.4"
hex-literal = "1.1"
hmac = { version = "0.13", features = ["zeroize"] }
getrandom = "0.4"
libc = "0.2"
md-5 = "0.11"
md4 = "0.11"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
zeroize = "1.7"

[dev-dependencies]
fabi-testkit = { path = "../fabi-testkit" }
proptest = { version = "1.12", default-features = false, features = ["std"] }
